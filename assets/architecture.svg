<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif">
<title>Where omp-forwarder sits</title>
<defs>
  <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5ed6cb"/>
  </marker>
  <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7f9ba7"/>
  </marker>
  <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f0b25e"/>
  </marker>
</defs>
<style>
  .panel{fill:#101e26;stroke:#1d3440;stroke-width:1.5}
  .ours{fill:#0d1a21;stroke:#5ed6cb;stroke-width:2}
  .h{fill:#dcecf1;font-size:14.5px;font-weight:600}
  .port{fill:#5ed6cb;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  .s{fill:#7f9ba7;font-size:11.5px}
  .on-teal{fill:#5ed6cb;font-size:11.5px;font-weight:600}
  .on-grey{fill:#7f9ba7;font-size:11.5px}
  .on-amber{fill:#f0b25e;font-size:11px}
  .warn{fill:#f0b25e;font-size:11.5px}
  .fast{stroke:#5ed6cb;stroke-width:2.5;fill:none}
  .slow{stroke:#7f9ba7;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
  .aux{stroke:#f0b25e;stroke-width:1.4;fill:none;stroke-dasharray:2 4}
</style>

<rect x="0" y="0" width="880" height="470" fill="#0b141a"/>
<text class="h" x="32" y="36" font-size="17">omp-forwarder — one fixed port in front of a moving one</text>
<text class="s" x="32" y="57" font-size="12.5">Every box runs on this machine, on loopback only.</text>

<!-- ROW 1: the fast path, left to right -->
<rect class="panel" x="32" y="96" width="176" height="92" rx="12"/>
<text class="h" x="52" y="126">Your client</text>
<text class="s" x="52" y="147">omp, an editor, any</text>
<text class="s" x="52" y="164">OpenAI-compatible tool</text>

<rect class="ours" x="316" y="90" width="212" height="104" rx="12"/>
<text class="h" x="336" y="120">omp-forwarder</text>
<text class="port" x="336" y="140">127.0.0.1:8890</text>
<text class="s" x="336" y="162">raw TCP relay — reads the</text>
<text class="s" x="336" y="179">request line, never a body</text>

<rect class="panel" x="636" y="96" width="212" height="92" rx="12"/>
<text class="h" x="656" y="126">llama-server</text>
<text class="port" x="656" y="146">127.0.0.1:55084</text>
<text class="warn" x="656" y="171">port re-rolls on every reload</text>

<path class="fast" d="M208,142 L310,142" marker-end="url(#teal)"/>
<text class="on-teal" x="212" y="132">a port that</text>
<text class="on-teal" x="212" y="164">never moves</text>

<path class="fast" d="M528,142 L630,142" marker-end="url(#teal)"/>
<text class="on-teal" x="536" y="132">fast path</text>
<text class="s" x="536" y="164">246 ms</text>

<!-- discovery, above the relay -->
<path class="aux" d="M470,90 L470,74 L742,74 L742,92" marker-end="url(#amber)"/>
<text class="on-amber" x="478" y="68">finds it: tasklist + netstat + GET /health, re-run whenever a connect fails</text>

<!-- ROW 2 -->
<rect class="panel" x="316" y="286" width="212" height="92" rx="12"/>
<text class="h" x="336" y="316">Dashboard</text>
<text class="port" x="336" y="336">/__stats</text>
<text class="s" x="336" y="361">answered locally, not relayed</text>

<rect class="panel" x="636" y="286" width="212" height="92" rx="12"/>
<text class="h" x="656" y="316">Unsloth Studio</text>
<text class="port" x="656" y="336">127.0.0.1:8888</text>
<text class="s" x="656" y="361">loads models · needs a key</text>

<!-- Studio relays down to llama-server -->
<path class="slow" d="M742,282 L742,192" marker-end="url(#grey)"/>
<text class="on-grey" x="752" y="240">Studio relays</text>
<text class="on-grey" x="752" y="256">here too</text>

<!-- forwarder -> studio fallback -->
<path class="aux" d="M422,194 L422,240 L580,240 L580,332 L630,332" marker-end="url(#amber)"/>
<text class="on-amber" x="430" y="234">fallback when no model is loaded</text>

<!-- client -> studio, the replaced path -->
<path class="slow" d="M120,188 L120,420 L862,420 L862,382" marker-end="url(#grey)"/>
<text class="on-grey" x="132" y="414">the path this replaces — same request, 384 ms, and Studio's own panel stops counting once a client leaves it</text>

<!-- footer -->
<line x1="32" y1="440" x2="848" y2="440" stroke="#1d3440" stroke-width="1"/>
<text class="s" x="32" y="460" font-size="12">36% off a short call · 8% faster streaming · first token in 107 ms instead of 261 · the traffic numbers Studio can no longer show you</text>
</svg>
