<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif">
<title>Studio proxy vs the forwarder</title>
<style>
  .h{fill:#dcecf1;font-size:14px;font-weight:600}
  .s{fill:#7f9ba7;font-size:11.5px}
  .lab{fill:#dcecf1;font-size:12px}
  .val{fill:#dcecf1;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  .win{fill:#5ed6cb;font-size:12px;font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .gain{fill:#5cc98c;font-size:11.5px;font-weight:600}
  .cap{fill:#7f9ba7;font-size:10.5px}
  .slow{fill:#3d5b68}
  .fast{fill:#5ed6cb}
</style>
<rect x="0" y="0" width="880" height="470" fill="#0b141a"/>

<text class="h" x="32" y="34" font-size="16.5">Unsloth Studio’s proxy vs the forwarder</text>
<text class="s" x="32" y="55">Same model, same requests, the two paths interleaved so both saw the same machine state. Shorter is better.</text>

<!-- legend -->
<rect x="672" y="26" width="10" height="10" rx="2" class="slow"/>
<text class="s" x="690" y="35">via Studio :8888</text>
<rect x="672" y="44" width="10" height="10" rx="2" class="fast"/>
<text class="s" x="690" y="53">via forwarder :8890</text>

<!-- ROW 1: short request latency (384 vs 246 ms) scale: 470px = 400ms -->
<text class="lab" x="32" y="98">Short request</text>
<text class="cap" x="32" y="114">median of 20</text>
<rect x="196" y="84" width="451" height="17" rx="3" class="slow"/>
<text class="val" x="655" y="97">384 ms</text>
<rect x="196" y="106" width="289" height="17" rx="3" class="fast"/>
<text class="win" x="493" y="119">246 ms</text>
<text class="gain" x="762" y="108">36% faster</text>

<!-- ROW 2: agent turn wall (1.94 vs 1.78 s) scale: 470 = 2.2s -->
<text class="lab" x="32" y="166">Agent turn</text>
<text class="cap" x="32" y="182">20k cached context,</text>
<text class="cap" x="32" y="196">150-token reply</text>
<rect x="196" y="152" width="414" height="17" rx="3" class="slow"/>
<text class="val" x="618" y="165">1.94 s</text>
<rect x="196" y="174" width="380" height="17" rx="3" class="fast"/>
<text class="win" x="584" y="187">1.78 s</text>
<text class="gain" x="762" y="176">8% faster</text>

<!-- ROW 3: time to first token (264 vs 103 ms) scale 470 = 300ms -->
<text class="lab" x="32" y="248">First token</text>
<text class="cap" x="32" y="264">what every agent</text>
<text class="cap" x="32" y="278">turn waits on</text>
<rect x="196" y="234" width="414" height="17" rx="3" class="slow"/>
<text class="val" x="618" y="247">264 ms</text>
<rect x="196" y="256" width="161" height="17" rx="3" class="fast"/>
<text class="win" x="365" y="269">103 ms</text>
<text class="gain" x="762" y="258">61% faster</text>

<!-- ROW 4: throughput, longer is better -->
<line x1="32" y1="312" x2="848" y2="312" stroke="#1d3440" stroke-width="1"/>
<text class="s" x="32" y="334">Streamed generation — here longer is better.</text>
<text class="lab" x="32" y="378">Decode rate</text>
<text class="cap" x="32" y="394">400-token reply</text>
<rect x="196" y="364" width="386" height="17" rx="3" class="slow"/>
<text class="val" x="590" y="377">56.2 tok/s</text>
<rect x="196" y="386" width="418" height="17" rx="3" class="fast"/>
<text class="win" x="622" y="399">60.8 tok/s</text>
<text class="gain" x="762" y="388">8% faster</text>

<line x1="32" y1="428" x2="848" y2="428" stroke="#1d3440" stroke-width="1"/>
<text class="s" x="32" y="450">The relay’s own cost is 11 ms per call, measured against llama-server direct. Latency gains are fixed per call; throughput gains grow with model speed.</text>
</svg>
