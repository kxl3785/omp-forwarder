[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-forwarder"
version = "0.2.1"
description = "A fixed local port in front of Unsloth Studio's llama-server, with a live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llama.cpp", "unsloth", "llm", "proxy", "openai-api", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# Only needed for --tray. The forwarder runs headless without it.
tray = ["pywin32; sys_platform == 'win32'"]

[project.scripts]
omp-forwarder = "omp_forwarder.forwarder:main"

[tool.setuptools.packages.find]
where = ["src"]
